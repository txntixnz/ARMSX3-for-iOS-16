name: ARMSX3 iOS 16 - Installable IPA build
on:
  push:
    branches: [main]
    paths:
      - 'armsx3-ios16/core/**'
      - 'armsx3-ios16/ios/src/StartupLog.*'
      - 'armsx3-ios16/ios/src/LogSyncPolicy.h'
      - 'armsx3-ios16/ios/Entitlements.plist'
      - 'armsx3-ios16/ios/scripts/verify-bundle.py'
      - 'armsx3-ios16/patches/**'
      - 'armsx3-ios16/tests/**'
      - '.github/workflows/build-armsx3-ios16-core.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: armsx3-ios16-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synchronization-host:
    name: Check ${{ matrix.script }} (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - script: test_p80_pair.py
            profile: fifo
          - script: test_p80_pair.py
            profile: priority
          - script: test_p82_pair.py
            profile: and
          - script: test_p82_pair.py
            profile: or
          - script: test_p82_pair.py
            profile: clear
          - script: test_p82_pair.py
            profile: clear_all
          - script: test_p86_pair.py
            profile: fifo
          - script: test_p86_pair.py
            profile: recursive
          - script: test_p86_pair.py
            profile: broadcast
          - script: test_p86_pair.py
            profile: recursive_broadcast
          - script: test_p90_pair.py
            profile: reader_fifo
          - script: test_p90_pair.py
            profile: reader_priority
          - script: test_p90_pair.py
            profile: writer_fifo
          - script: test_p90_pair.py
            profile: writer_priority
          - script: test_p94_pair.py
            profile: fifo
          - script: test_p94_pair.py
            profile: priority
          - script: test_p94_pair.py
            profile: cancel_fifo
          - script: test_p94_pair.py
            profile: cancel_priority
          - script: test_p98_pair.py
            profile: queue_fifo_min
          - script: test_p98_pair.py
            profile: queue_priority_max
          - script: test_p98_pair.py
            profile: queue_spu_fifo_min
          - script: test_p98_pair.py
            profile: queue_spu_priority_max
          - script: test_p98_pair.py
            profile: port_local_named
          - script: test_p98_pair.py
            profile: port_local_auto
          - script: test_p98_pair.py
            profile: port_ipc_named
          - script: test_p98_pair.py
            profile: port_ipc_auto
          - script: test_p106_pair.py
            profile: ppu_fifo_named
          - script: test_p106_pair.py
            profile: ppu_fifo_auto
          - script: test_p106_pair.py
            profile: ppu_priority_named
          - script: test_p106_pair.py
            profile: ppu_priority_auto
          - script: test_p106_pair.py
            profile: spu_fifo_named
          - script: test_p106_pair.py
            profile: spu_fifo_auto
          - script: test_p106_pair.py
            profile: spu_priority_named
          - script: test_p106_pair.py
            profile: spu_priority_auto
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned native source
        uses: actions/checkout@v4
        with:
          repository: ARMSX2/ARMSX3
          ref: 92b931b9fb5eef7f1317cb482917dfc19aceebd9
          path: upstream-armsx3
          submodules: false
      - name: Verify fixtures and prepare extracted native bodies
        shell: bash
        run: |
          set -euo pipefail
          python3 armsx3-ios16/tests/test_p114_fixture.py
          python3 armsx3-ios16/tests/test_p82_registry.py upstream-armsx3
          python3 armsx3-ios16/tests/test_p86_registry.py upstream-armsx3
          python3 armsx3-ios16/tests/test_p90_registry.py upstream-armsx3
          python3 armsx3-ios16/tests/test_p94_registry.py upstream-armsx3
          for patch in armsx3-ios16/patches/*.patch; do
            git -C upstream-armsx3 apply --check "../$patch"
            git -C upstream-armsx3 apply "../$patch"
          done
          # The host model provides syscall statistics; extract the original
          # pinned dispatcher. This checkout is isolated from the iOS build.
          git -C upstream-armsx3 show HEAD:rpcs3/Emu/Cell/lv2/lv2.cpp > upstream-armsx3/rpcs3/Emu/Cell/lv2/lv2.cpp
      - name: Run extracted native workload under sanitizers
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          set -euo pipefail
          python3 armsx3-ios16/tests/${{ matrix.script }} \
            upstream-armsx3/rpcs3/Emu/Cell/PPUThread.cpp \
            armsx3-ios16/core/loadtest/CoreBridge.cpp \
            upstream-armsx3/rpcs3/Emu/Cell/Modules/sys_ppu_thread_.cpp \
            "${{ matrix.profile }}"
  intake-host:
    name: Check intake, runtime and guest start
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned native source
        uses: actions/checkout@v4
        with:
          repository: ARMSX2/ARMSX3
          ref: 92b931b9fb5eef7f1317cb482917dfc19aceebd9
          path: upstream-armsx3
          submodules: false
      - name: Verify intake and runtime frontend/lifecycle contracts
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          set -euo pipefail
          python3 armsx3-ios16/tests/test_p114_fixture.py
          python3 armsx3-ios16/tests/test_p114_intake.py upstream-armsx3
          python3 armsx3-ios16/tests/test_runtime.py upstream-armsx3
          python3 armsx3-ios16/tests/test_ios_pad_input.py upstream-armsx3
          python3 armsx3-ios16/tests/test_ios_menu_memory.py upstream-armsx3
          python3 armsx3-ios16/tests/test_native_renderer.py upstream-armsx3
          python3 armsx3-ios16/tests/test_ios_signal_recovery.py upstream-armsx3
          python3 armsx3-ios16/tests/test_ios_zcull_reports.py upstream-armsx3
          python3 armsx3-ios16/tests/test_ios_graphics_memory.py upstream-armsx3
          python3 armsx3-ios16/tests/test_ios_upload_retirement.py upstream-armsx3
          python3 armsx3-ios16/tests/test_vulkan_config.py upstream-armsx3
          python3 armsx3-ios16/tests/test_jit_lifecycle.py upstream-armsx3
          python3 armsx3-ios16/tests/test_spu_cache_startup.py upstream-armsx3
          python3 armsx3-ios16/tests/test_spu_thread_entry.py upstream-armsx3
          python3 armsx3-ios16/tests/test_game_import.py upstream-armsx3
  graphics-host:
    name: Check real Vulkan work and graphics cleanup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned native source
        uses: actions/checkout@v4
        with:
          repository: ARMSX2/ARMSX3
          ref: 92b931b9fb5eef7f1317cb482917dfc19aceebd9
          path: upstream-armsx3
          submodules: false
      - name: Install software Vulkan and validation layers
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers
      - name: Verify GPU commands and failure lifecycles
        env:
          ASAN_OPTIONS: detect_leaks=0
          GRAPHICS_VALIDATION: '1'
        run: |
          set -euo pipefail
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name '*lvp*json' -print -quit)"
          test -n "$VK_ICD_FILENAMES"
          python3 armsx3-ios16/tests/test_graphics_device.py
          python3 armsx3-ios16/tests/test_framegen_link.py upstream-armsx3
  core:
    needs: [synchronization-host, intake-host, graphics-host]
    name: Cross-compile real rpcs3_emu for iOS 16 arm64
    runs-on: macos-15
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned ARMSX3
        uses: actions/checkout@v4
        with:
          repository: ARMSX2/ARMSX3
          ref: 92b931b9fb5eef7f1317cb482917dfc19aceebd9
          path: upstream-armsx3
          submodules: false
      - name: Checkout pinned FFmpeg 8.0 source
        uses: actions/checkout@v4
        with:
          repository: FFmpeg/FFmpeg
          ref: 140fd653aed8cad774f991ba083e2d01e86420c7
          path: ffmpeg-source
      - name: Fetch pinned core dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          root = 'upstream-armsx3'
          entries = subprocess.check_output(['git', '-C', root, 'config', '--file', '.gitmodules', '--get-regexp', 'path'], text=True)
          # Exclude large unused backends. Every selected dependency stays at its gitlink SHA.
          excluded = {'3rdparty/llvm/llvm', '3rdparty/ffmpeg', '3rdparty/FAudio', '3rdparty/libsdl-org/SDL', '3rdparty/oboe/oboe', '3rdparty/opencv/opencv', '3rdparty/feralinteractive/feralinteractive'}
          paths = [line.split(None, 1)[1] for line in entries.splitlines() if line.split(None, 1)[1] not in excluded]
          subprocess.run(['git', '-C', root, 'submodule', 'update', '--init', '--recursive', '--depth', '1', '--jobs', '4', '--', *paths], check=True)
          PY
      - name: Apply iOS core patches
        shell: bash
        run: |
          set -euo pipefail
          python3 armsx3-ios16/ios/scripts/audit-hook-consumers.py upstream-armsx3
          python3 armsx3-ios16/tests/test_p43_patch.py upstream-armsx3/rpcs3/Emu/Cell/lv2/sys_memory.cpp
          python3 armsx3-ios16/tests/test_p114_fixture.py
          python3 armsx3-ios16/tests/test_p73_patch.py upstream-armsx3
          python3 armsx3-ios16/tests/test_p76_registry.py upstream-armsx3
          python3 armsx3-ios16/tests/test_p82_registry.py upstream-armsx3
          python3 armsx3-ios16/tests/test_p86_registry.py upstream-armsx3
          python3 armsx3-ios16/tests/test_p90_registry.py upstream-armsx3
          python3 armsx3-ios16/tests/test_p94_registry.py upstream-armsx3
          for patch in armsx3-ios16/patches/*.patch; do
            git -C upstream-armsx3 apply --check "../$patch"
            git -C upstream-armsx3 apply "../$patch"
          done
          cp -R armsx3-ios16/core upstream-armsx3/ios-core
          cp -R armsx3-ios16/ios upstream-armsx3/ios
          cp armsx3-ios16/core/apple_jit.hpp upstream-armsx3/rpcs3/util/apple_jit.hpp
          cp armsx3-ios16/core/immutable_jit.hpp upstream-armsx3/rpcs3/util/immutable_jit.hpp
      - name: Fetch and verify pinned iOS MoltenVK
        shell: bash
        run: bash armsx3-ios16/core/fetch-moltenvk.sh "$GITHUB_WORKSPACE/moltenvk-ios"
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version
          ninja --version
      - name: Build iOS FFmpeg libraries
        shell: bash
        run: |
          set -euo pipefail
          bash armsx3-ios16/core/build-ffmpeg.sh ffmpeg-source "$GITHUB_WORKSPACE/ffmpeg-ios" 2>&1 | tee ffmpeg-ios-build.log
      - name: Compile emulator core archive
        shell: bash
        run: |
          set -euo pipefail
          bash armsx3-ios16/core/build-core.sh upstream-armsx3 ffmpeg-ios moltenvk-ios 2>&1 | tee armsx3-core-build.log
      - name: Verify and collect iOS archive
        shell: bash
        run: |
          set -euo pipefail
          python3 armsx3-ios16/core/verify-archive.py upstream-armsx3/build-ios-core/rpcs3/Emu/librpcs3_emu.a
          mkdir -p core-artifacts
          cp upstream-armsx3/build-ios-core/rpcs3/Emu/librpcs3_emu.a core-artifacts/
          cp armsx3-ios16/core/README.md core-artifacts/
          git -C upstream-armsx3 rev-parse HEAD > core-artifacts/UPSTREAM_COMMIT
          git -C upstream-armsx3 submodule status --recursive > core-artifacts/DEPENDENCIES.txt
      - name: Upload compile-only core archive
        uses: actions/upload-artifact@v4
        with:
          name: ARMSX3_iOS16_P1_CORE_ARCHIVE_NOT_AN_IPA
          path: core-artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Link full core and package P2 load-test IPA
        shell: bash
        run: |
          set -euo pipefail
          bash armsx3-ios16/core/package-loadtest.sh upstream-armsx3 2>&1 | tee armsx3-core-link-build.log
      - name: Upload P2 load-test IPA
        uses: actions/upload-artifact@v4
        with:
          name: ARMSX3_iOS16_INSTALL_THIS_IPA
          path: upstream-armsx3/dist-ios-core/
          if-no-files-found: error
          retention-days: 14
      - name: Upload matching core symbols
        uses: actions/upload-artifact@v4
        with:
          name: ARMSX3_iOS16_P2_CORE_SYMBOLS_NOT_AN_IPA
          path: upstream-armsx3/core-symbols/
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ARMSX3_iOS16_P1_CORE_BUILD_LOGS
          path: |
            *-build.log
            ffmpeg-source/ffbuild/config.log
            upstream-armsx3/build-ios-core/CMakeCache.txt
            upstream-armsx3/build-ios-core/CMakeFiles/CMakeConfigureLog.yaml
            upstream-armsx3/build-ios-core/compile_commands.json
          if-no-files-found: warn
          retention-days: 14
